<!doctype html>
<html><body>
<h1>Moderator Panel</h1>
<p><a href='/home'>← Home</a></p>
<p>Разделы: Игроки / Отправки / Заявки (UI-заглушка).</p>
<script type='module'>
import { requireAuth, getAuthedContext, ensureVerified, ensureRole } from './js/guards.js';
requireAuth(async (user) => {
  const ctx = await getAuthedContext(user); if (!ctx) return;
  if (!ensureVerified(ctx.user, ctx.profile)) return;
  ensureRole(ctx.profile, ['moder', 'elder']);
});
</script>
</body></html>
