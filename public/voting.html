<!doctype html>
<html><body>
<h1>Голосование</h1>
<p><a href='./home.html'>← Home</a></p>
<p>Минимальный защищенный экран. Полная пошаговая расстановка мест будет добавлена следующей итерацией.</p>
<script type='module'>
import { requireAuth, getAuthedContext, ensureVerified } from './js/guards.js';
requireAuth(async (user) => {
  const ctx = await getAuthedContext(user); if (!ctx) return;
  ensureVerified(ctx.user, ctx.profile);
});
</script>
</body></html>
